{% extends 'CodeClone/base.html'%}

{% block body %}

<div class="row">
    <div class="fourcol column last">
        <h1>Sign In</h1>
        {% if demo_hint %}
        <div style="margin:1rem 0;padding:.75rem 1rem;border:1px solid #cfe;background:#eef;border-radius:6px;font-size:.9rem;color:#334;">
          <strong>Demo login</strong> — username: <code>demo</code> &nbsp; password: <code>demo12345</code>
        </div>
        {% endif %}
        <form class="ajax-form formatted-form" action="" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input class="form-control" name="login_username" type="text" required/>
                <input class="form-control" name="login_password" type="password" required/>
            </div>
            <div class="form-group">
                <div class="d-flex justify-content-center">
                    <button type="submit" class="element-button">Submit</button>
                </div>
            </div>
            <div class="form-group">
                {% for message in messages %}
                <h5 class=""><font color="red">{{ message }}</font></h5>
                {% endfor %}
            </div>
            <div class="form-group">
                <div class="d-flex justify-content-center">
                    <span>Not A User ? </span>
                    &nbsp &nbsp
                    <a href="{% url 'signup' %}">Signup</a>
                </div>
            </div>
        </form>
    </div>
</div>


{% endblock %}
