<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Code Clone Detector{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'CodeClone/css/ccd.css' %}">
    {% block css %}{% endblock %}
</head>
<body>
    <header class="nav">
        <div class="container nav__in">
            <a class="mark" href="{% url 'index' %}"><span class="mark__glyph"></span> Code Clone Detector</a>
            <nav class="nav__links">
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a class="btn btn--ghost" href="{% url 'login' %}">Sign in</a>
            </nav>
        </div>
    </header>

    {% block body %}{% endblock %}

    <footer class="footer">
        <div class="container footer__in">
            <a class="mark" href="{% url 'index' %}"><span class="mark__glyph"></span> Code Clone Detector</a>
            <span class="mono" style="font-size:.8rem">Code Clone Detector &copy; 2026 · n-grams + Halstead · cosine similarity</span>
        </div>
    </footer>
    {% block script %}{% endblock %}
</body>
</html>
